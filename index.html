<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Para ti 🌻</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Dancing+Script:wght@600;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --sol: #ffd23f;
    --miel: #f4a81d;
    --noche: #0a1330;
    --hoja: #3f9a4b;
    --crema: #fff6dc;
    --script: "Dancing Script", "Brush Script MT", cursive;
    --serif: "Cormorant Garamond", Georgia, serif;
    --sans: "Quicksand", "Segoe UI", Arial, sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; width: 100%; height: 100%; overflow: hidden;
    background: var(--noche); color: var(--crema); font-family: var(--sans);
  }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

  /* ---------- Pantalla inicial ---------- */
  .intro {
    position: fixed; inset: 0; z-index: 30;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 26px; text-align: center; padding: 24px;
    background: radial-gradient(circle at 50% 45%, rgba(10,19,48,.55), rgba(5,9,22,.95));
    transition: opacity 1.6s ease, visibility 1.6s;
  }
  .intro.hide { opacity: 0; visibility: hidden; }
  .intro h1 {
    margin: 0; font-family: var(--script); font-weight: 700;
    font-size: clamp(42px, 9vw, 80px); color: var(--sol);
    text-shadow: 0 0 30px rgba(255,210,63,.35);
  }
  .intro p { margin: 0; font-family: var(--serif); font-style: italic; font-size: clamp(18px, 3.4vw, 24px); opacity: .85; }
  .open-btn {
    width: 118px; height: 118px; border-radius: 50%; border: 0; cursor: pointer;
    font-size: 64px; line-height: 1; background: transparent;
    animation: latido 1.8s ease-in-out infinite;
    filter: drop-shadow(0 0 22px rgba(255,210,63,.55));
  }
  .open-hint { font-size: 14px; letter-spacing: .5px; opacity: .7; }
  @keyframes latido { 0%,100% { transform: scale(1); } 15% { transform: scale(1.12); } 30% { transform: scale(.97); } 45% { transform: scale(1.08); } }

  /* ---------- Mensajes ---------- */
  .content {
    position: fixed; inset: 0; z-index: 10;
    display: flex; align-items: center; justify-content: center;
    padding: 24px 22px 26vh; text-align: center; pointer-events: none;
  }
  .message {
    position: relative; width: min(92vw, 700px); padding: 34px 20px;
    opacity: 0; transform: translateY(18px);
    transition: opacity 1.8s ease, transform 1.8s ease;
    text-shadow: 0 2px 16px rgba(0,0,0,.85);
  }
  .message::before {
    content: ""; position: absolute; inset: -20% -10%; z-index: -1;
    background: radial-gradient(ellipse at center, rgba(4,10,24,.62) 0%, rgba(4,10,24,.35) 45%, transparent 72%);
  }
  .message.show { opacity: 1; transform: translateY(0); }
  .lead {
    font-family: var(--serif); font-style: italic; font-size: clamp(19px, 3.6vw, 26px);
    color: var(--sol); margin-bottom: 14px; opacity: .95;
  }
  .message h2 {
    margin: 0; font-family: var(--serif); font-weight: 600;
    font-size: clamp(34px, 7.4vw, 64px); line-height: 1.08;
  }
  .message p {
    margin: 18px auto 0; max-width: 560px;
    font-size: clamp(17px, 3.3vw, 22px); line-height: 1.7;
  }
  .big-emoji { font-size: clamp(54px, 12vw, 90px); line-height: 1; }
  .question {
    margin: 0; font-family: var(--script); font-weight: 700;
    font-size: clamp(48px, 11vw, 96px); line-height: 1.05; color: var(--sol);
    text-shadow: 0 0 28px rgba(255,210,63,.35), 0 3px 18px rgba(0,0,0,.9);
  }
  .buttons {
    margin-top: 34px; display: flex; gap: 16px; justify-content: center; align-items: center;
    flex-wrap: wrap; pointer-events: auto; min-height: 70px;
  }
  .btn {
    border: 0; border-radius: 999px; padding: 15px 30px; cursor: pointer;
    font-family: var(--sans); font-size: 17px; font-weight: 700;
    transition: transform .35s cubic-bezier(.34,1.56,.64,1), box-shadow .3s ease, opacity .4s ease;
  }
  .btn:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
  .btn-yes {
    background: linear-gradient(180deg, #ffe168, var(--sol));
    color: #3a2a00; box-shadow: 0 0 26px rgba(255,210,63,.45);
    animation: brillo 2.2s ease-in-out infinite;
  }
  @keyframes brillo { 0%,100% { box-shadow: 0 0 22px rgba(255,210,63,.35); } 50% { box-shadow: 0 0 44px rgba(255,210,63,.75); } }
  .btn-no {
    background: rgba(255,255,255,.1); color: var(--crema);
    border: 1px solid rgba(255,255,255,.45); backdrop-filter: blur(6px);
  }
  .tease {
    margin-top: 18px; min-height: 30px; font-family: var(--serif); font-style: italic;
    font-size: clamp(18px, 3.4vw, 24px); color: #ffe9a8; pointer-events: none;
    transition: opacity .4s ease;
  }
  .hint {
    position: fixed; left: 0; right: 0; bottom: calc(18px + env(safe-area-inset-bottom, 0px));
    z-index: 11; text-align: center; font-size: 13px; opacity: 0; letter-spacing: .4px;
    transition: opacity 1s ease; pointer-events: none;
  }
  .hint.show { opacity: .6; }

  /* ---------- Final ---------- */
  .final {
    position: fixed; inset: 0; z-index: 20;
    display: flex; align-items: center; justify-content: center; padding: 22px;
    opacity: 0; visibility: hidden; transition: opacity 1.6s ease, visibility 1.6s;
  }
  .final.show { opacity: 1; visibility: visible; }
  .final-card {
    width: min(92vw, 560px); padding: 40px 28px 34px; border-radius: 34px 34px 34px 8px;
    background: rgba(10,19,48,.66); border: 1px solid rgba(255,210,63,.45);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    box-shadow: 0 24px 90px rgba(0,0,0,.5), 0 0 60px rgba(255,210,63,.15);
    text-align: center; transform: scale(.85) translateY(20px);
    transition: transform 1.4s cubic-bezier(.22,1.2,.36,1);
  }
  .final.show .final-card { transform: scale(1) translateY(0); }
  .final-card .flor { font-size: 62px; display: inline-block; animation: girar 9s linear infinite; }
  @keyframes girar { to { transform: rotate(360deg); } }
  .final-card h3 {
    margin: 10px 0 0; font-family: var(--script); font-weight: 700;
    font-size: clamp(46px, 10vw, 76px); color: var(--sol); line-height: 1.05;
  }
  .final-card p { margin: 18px auto 0; max-width: 440px; font-size: clamp(16px, 3.2vw, 20px); line-height: 1.7; }
  .final-card .firma { font-family: var(--serif); font-style: italic; font-size: clamp(21px, 4vw, 28px); color: #ffe9a8; }
  .again {
    margin-top: 26px; background: transparent; color: var(--crema);
    border: 1px solid rgba(255,255,255,.35); font-size: 14px; padding: 10px 20px;
  }

  @media (max-width: 520px) {
    .content { padding-bottom: 30vh; }
    .btn { padding: 14px 26px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .open-btn, .btn-yes, .final-card .flor { animation: none; }
  }
</style>
</head>
<body>

<canvas id="garden"></canvas>

<div class="intro" id="intro">
  <h1>Tengo algo para ti</h1>
  <p>Busca un lugar tranquilo y sube el brillo de tu pantalla</p>
  <button class="open-btn" id="openBtn" aria-label="Abrir el regalo">🌻</button>
  <div class="open-hint">Toca el girasol para abrirlo</div>
</div>

<div class="content">
  <div class="message" id="message"></div>
</div>

<div class="hint" id="hint">Toca la pantalla para seguir</div>

<div class="final" id="final">
  <div class="final-card">
    <span class="flor">🌻</span>
    <h3>Entonces… sí ❤️</h3>
    <p>
      Gracias por decir que sí, mi reina.<br><br>
      Espero que este sea apenas el comienzo de muchos momentos bonitos juntos.
    </p>
    <p class="firma">Feliz cumpleaños, mi amor 🌻</p>
    <button class="btn again" id="again">Ver otra vez</button>
  </div>
</div>

<script>
/* ===================== Configuración ===================== */
// Cuánto tiempo (ms) se queda cada mensaje antes de pasar al siguiente
const STORY = [
  { dur: 9500, html: `
      <div class="lead">Hay algo más para ti…</div>
      <div class="big-emoji">🌻</div>
      <p>Y quería que lo descubrieras poco a poco.</p>` },
  { dur: 11000, html: `
      <div class="lead">Mira con atención</div>
      <p>Preparé este pequeño jardín pensando en ti…<br>
      y en una pregunta que llevo un tiempo queriendo hacerte.</p>` },
  { dur: 11000, html: `
      <div class="lead">¿Sabías que los girasoles siempre buscan el sol?</div>
      <h2>Así me pasa contigo ☀️</h2>
      <p>Donde sea que estés, mis ojos te buscan a ti.</p>` },
  { dur: 8500, html: `
      <div class="lead">Y ahora…</div>
      <h2>La pregunta es la siguiente ❤️</h2>` }
];

const QUESTION = `
  <div class="lead">Después de todo este detalle…</div>
  <h1 class="question">¿Quieres ser<br>mi novia? 🌻</h1>
  <div class="buttons">
    <button class="btn btn-yes" data-action="yes" id="yesBtn">Sí ❤️</button>
    <button class="btn btn-no" data-action="no" id="noBtn">Necesito pensarlo 🥺</button>
  </div>
  <div class="tease" id="tease"></div>`;

// Lo que pasa cada vez que toca "Necesito pensarlo"
const NO_STEPS = [
  { btn: "¿Segura? 🥺",            tease: "Jajaja, ¿cómo que pensarlo?" },
  { btn: "Piénsalo otra vez…",      tease: "Mira todas las flores que te traje 🌻" },
  { btn: "Última oportunidad 😤",   tease: "Si dices que no… te voy a secuestrar 😤" },
  { btn: null,                      tease: "Ya no hay opción de pensarlo. Solo queda una respuesta 💛" }
];

/* ===================== Utilidades ===================== */
const $ = id => document.getElementById(id);
const rand = (a, b) => Math.random() * (b - a) + a;
const canvas = $("garden"), ctx = canvas.getContext("2d");
const message = $("message"), hint = $("hint");

let W = 0, H = 0, dpr = 1;
let flowers = [], grass = [], stars = [], fireflies = [], particles = [];
let phase = "intro";          // intro | story | question | yes
let growStart = Infinity;     // cuándo empiezan a crecer las flores
let warmth = 0, warmthTarget = 0.35;
let storyIndex = 0, storyTimer = null, noCount = 0, rainUntil = 0;

/* ===================== Girasol pre-dibujado ===================== */
const SPR = 90;  // radio del sprite
const sprite = document.createElement("canvas");
(function makeSprite() {
  sprite.width = sprite.height = SPR * 4;
  const c = sprite.getContext("2d");
  c.scale(2, 2); c.translate(SPR, SPR);
  const R = SPR * 0.96;

  function petals(n, offset, dist, rx, ry, c1, c2) {
    for (let i = 0; i < n; i++) {
      c.save();
      c.rotate(offset + (Math.PI * 2 / n) * i);
      const g = c.createLinearGradient(0, -R * 0.2, 0, -(dist + ry));
      g.addColorStop(0, c1); g.addColorStop(1, c2);
      c.beginPath();
      c.ellipse(0, -dist, rx, ry, 0, 0, Math.PI * 2);
      c.fillStyle = g; c.fill();
      c.restore();
    }
  }
  petals(18, 0, R * 0.6, R * 0.13, R * 0.38, "#d98a0b", "#f8b923");
  petals(18, Math.PI / 18, R * 0.52, R * 0.12, R * 0.32, "#f0a414", "#ffdc4f");

  const cg = c.createRadialGradient(0, 0, 2, 0, 0, R * 0.34);
  cg.addColorStop(0, "#2b1605"); cg.addColorStop(.7, "#5c3410"); cg.addColorStop(1, "#3a200a");
  c.beginPath(); c.arc(0, 0, R * 0.33, 0, Math.PI * 2); c.fillStyle = cg; c.fill();

  for (let i = 0; i < 170; i++) {
    const a = i * 2.39996, r = Math.sqrt(i / 170) * R * 0.3;
    c.beginPath(); c.arc(Math.cos(a) * r, Math.sin(a) * r, R * 0.013 + (i / 170) * R * 0.01, 0, Math.PI * 2);
    c.fillStyle = i % 3 ? "#9b6420" : "#d19a3a"; c.fill();
  }
})();

/* ===================== Escena ===================== */
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W * dpr; canvas.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  build();
}

function build() {
  flowers = []; grass = []; stars = []; fireflies = [];
  const mobile = W < 600;

  // Fila de atrás (más pequeñas y oscuras) y fila de adelante
  const rows = [
    { count: Math.max(9, Math.floor(W / 70)), depth: .62, hMin: .2, hMax: .34, sMin: 13, sMax: 19, yMin: 70, yMax: 120 },
    { count: Math.max(8, Math.min(26, Math.floor(W / 55))), depth: 1, hMin: .12, hMax: .28, sMin: mobile ? 20 : 24, sMax: mobile ? 28 : 36, yMin: 10, yMax: 60 }
  ];
  rows.forEach((row, r) => {
    for (let i = 0; i < row.count; i++) {
      flowers.push({
        x: (i + .5) * (W / row.count) + rand(-20, 20),
        baseY: H - rand(row.yMin, row.yMax),
        height: rand(H * row.hMin, H * row.hMax),
        size: rand(row.sMin, row.sMax),
        depth: row.depth,
        delay: r * 900 + i * 140 + rand(0, 600),
        sway: rand(0, Math.PI * 2),
        speed: rand(.0006, .0013),
        spin: rand(-.25, .25)
      });
    }
  });

  for (let x = 0; x < W; x += 6) grass.push({ x: x + rand(-3, 3), h: rand(10, 34), lean: rand(-10, 10), s: rand(0, 6) });

  const nStars = Math.floor(W * H / 5200);
  for (let i = 0; i < nStars; i++) stars.push({ x: rand(0, W), y: rand(0, H * .62), r: rand(.4, 1.5), t: rand(0, 6), sp: rand(.001, .003) });

  for (let i = 0; i < (mobile ? 14 : 26); i++) fireflies.push({ x: rand(0, W), y: rand(H * .35, H * .95), a: rand(0, 6), sp: rand(.2, .6), ph: rand(0, 6) });
}

function drawSky(now) {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, "#070d24");
  g.addColorStop(.45, "#122544");
  g.addColorStop(.72, "#1c3a33");
  g.addColorStop(1, "#08160e");
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  for (const s of stars) {
    const a = .35 + .65 * Math.abs(Math.sin(now * s.sp + s.t));
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255,248,220,${a * .9})`; ctx.fill();
  }

  // Luz cálida detrás de las flores (se enciende más cuando dice que sí)
  warmth += (warmthTarget - warmth) * .02;
  const glow = ctx.createRadialGradient(W / 2, H * .82, 10, W / 2, H * .82, Math.max(W, H) * .75);
  glow.addColorStop(0, `rgba(255,190,70,${warmth * .55})`);
  glow.addColorStop(.5, `rgba(255,150,60,${warmth * .18})`);
  glow.addColorStop(1, "rgba(255,150,60,0)");
  ctx.fillStyle = glow; ctx.fillRect(0, 0, W, H);
}

function drawGrass(now) {
  ctx.lineWidth = 1.3;
  ctx.strokeStyle = "rgba(60,140,70,.6)";
  ctx.beginPath();
  for (const g of grass) {
    const s = Math.sin(now * .001 + g.s) * 2.5;
    ctx.moveTo(g.x, H);
    ctx.quadraticCurveTo(g.x + g.lean * .3, H - g.h * .5, g.x + g.lean + s, H - g.h);
  }
  ctx.stroke();
  const ground = ctx.createLinearGradient(0, H - 120, 0, H);
  ground.addColorStop(0, "rgba(8,30,15,0)");
  ground.addColorStop(1, "rgba(3,14,7,.9)");
  ctx.fillStyle = ground; ctx.fillRect(0, H - 120, W, 120);
}

function drawLeaf(x, y, dir, scale, color) {
  ctx.save();
  ctx.translate(x, y); ctx.rotate(dir * -.55); ctx.scale(scale, scale);
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.quadraticCurveTo(dir * 20, -14, dir * 32, -2);
  ctx.quadraticCurveTo(dir * 18, 12, 0, 0);
  ctx.fillStyle = color; ctx.fill();
  ctx.restore();
}

function drawFlower(f, now) {
  const t = (now - growStart - f.delay) / 2400;
  if (t <= 0) return;
  const grow = Math.min(1, t);
  const e = 1 - Math.pow(1 - grow, 3);
  const extra = phase === "yes" ? 1.8 : 1;
  const sway = Math.sin(now * f.speed * extra + f.sway) * 8 * e;
  const topX = f.x + sway, topY = f.baseY - f.height * e;

  ctx.globalAlpha = f.depth < 1 ? .72 : 1;
  ctx.beginPath();
  ctx.moveTo(f.x, H);
  ctx.quadraticCurveTo(f.x - sway * .4, f.baseY - f.height * .45, topX, topY);
  ctx.strokeStyle = f.depth < 1 ? "#2c6b36" : "#3c8f46";
  ctx.lineWidth = f.depth < 1 ? 2.2 : 3.2;
  ctx.stroke();

  if (e > .3) {
    const leaf = f.depth < 1 ? "#347a3d" : "#4aa653";
    drawLeaf(f.x - sway * .1, f.baseY - f.height * .3 * e, -1, Math.min(1, (e - .3) * 2) * f.depth, leaf);
    drawLeaf(f.x - sway * .2, f.baseY - f.height * .55 * e, 1, Math.min(1, (e - .3) * 2) * f.depth, leaf);
  }

  // La flor se abre al final del crecimiento
  const bloom = Math.max(0, Math.min(1, (t - .65) / .6));
  if (bloom > 0) {
    const b = 1 - Math.pow(1 - bloom, 3);
    const pulse = phase === "yes" ? 1 + Math.sin(now * .004 + f.sway) * .06 : 1;
    const size = f.size * b * pulse;
    ctx.save();
    ctx.translate(topX, topY);
    ctx.rotate(sway * .02 + f.spin + (1 - b) * 1.5);
    ctx.drawImage(sprite, -size, -size, size * 2, size * 2);
    ctx.restore();
  }
  ctx.globalAlpha = 1;
}

function drawFireflies(now) {
  for (const f of fireflies) {
    f.a += (Math.random() - .5) * .3;
    f.x += Math.cos(f.a) * f.sp; f.y += Math.sin(f.a) * f.sp * .6;
    if (f.x < -10) f.x = W + 10; if (f.x > W + 10) f.x = -10;
    if (f.y < H * .3) f.y = H * .3; if (f.y > H) f.y = H * .95;
    const a = .25 + .75 * Math.max(0, Math.sin(now * .002 + f.ph));
    const g = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, 9);
    g.addColorStop(0, `rgba(255,236,140,${a})`);
    g.addColorStop(1, "rgba(255,236,140,0)");
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(f.x, f.y, 9, 0, Math.PI * 2); ctx.fill();
  }
}

/* ---------- Pétalos y corazones ---------- */
function heartPath(s) {
  ctx.beginPath();
  ctx.moveTo(0, s * .3);
  ctx.bezierCurveTo(-s, -s * .35, -s * .45, -s, 0, -s * .45);
  ctx.bezierCurveTo(s * .45, -s, s, -s * .35, 0, s * .3);
}

function spawn(x, y, burst) {
  const kind = Math.random() < .6 ? "petal" : "heart";
  const ang = rand(0, Math.PI * 2), spd = rand(3, 9);
  particles.push({
    x, y, kind,
    vx: burst ? Math.cos(ang) * spd : rand(-.6, .6),
    vy: burst ? Math.sin(ang) * spd - 3 : rand(1, 2.4),
    rot: rand(0, 6), vr: rand(-.08, .08),
    size: kind === "petal" ? rand(6, 11) : rand(7, 13),
    color: kind === "petal" ? (Math.random() < .5 ? "#ffd23f" : "#f6b21c") : (Math.random() < .5 ? "#ff4d6d" : "#ff8fab"),
    life: 1
  });
}

function drawParticles() {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.vy += .05; p.vy = Math.min(p.vy, 2.6);
    p.vx *= .985; p.x += p.vx + Math.sin(p.rot) * .4; p.y += p.vy; p.rot += p.vr;
    if (p.y > H + 30) { particles.splice(i, 1); continue; }
    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
    ctx.fillStyle = p.color;
    if (p.kind === "petal") { ctx.beginPath(); ctx.ellipse(0, 0, p.size * .35, p.size, 0, 0, Math.PI * 2); ctx.fill(); }
    else { heartPath(p.size); ctx.fill(); }
    ctx.restore();
  }
}

function loop(now) {
  drawSky(now);
  drawFireflies(now);
  drawGrass(now);
  for (const f of flowers) if (f.depth < 1) drawFlower(f, now);
  for (const f of flowers) if (f.depth === 1) drawFlower(f, now);

  if (phase === "yes") {
    const n = now < rainUntil ? 3 : (Math.random() < .25 ? 1 : 0);
    for (let i = 0; i < n; i++) spawn(rand(0, W), -20, false);
  }
  drawParticles();
  requestAnimationFrame(loop);
}

/* ===================== Historia ===================== */
function setMessage(html, after) {
  message.classList.remove("show");
  setTimeout(() => {
    message.innerHTML = html;
    message.classList.add("show");
    if (after) after();          // se ejecuta cuando el HTML YA existe
  }, 700);
}

function showStep(i) {
  clearTimeout(storyTimer);
  storyIndex = i;
  if (i >= STORY.length) { showQuestion(); return; }
  setMessage(STORY[i].html);
  storyTimer = setTimeout(() => showStep(i + 1), STORY[i].dur);
}

function showQuestion() {
  phase = "question";
  hint.classList.remove("show");
  setMessage(QUESTION);
}

/* Un solo "escuchador" para todos los botones: funciona aunque el HTML se cree después */
document.addEventListener("click", e => {
  const btn = e.target.closest("[data-action]");
  if (btn) {
    if (btn.dataset.action === "yes") accept(btn);
    if (btn.dataset.action === "no") thinkAboutIt(btn);
    return;
  }
  // Tocar la pantalla adelanta el mensaje (solo durante la historia)
  if (phase === "story" && message.classList.contains("show")) showStep(storyIndex + 1);
});

function thinkAboutIt(noBtn) {
  const step = NO_STEPS[Math.min(noCount, NO_STEPS.length - 1)];
  noCount++;
  const yes = $("yesBtn"), tease = $("tease");
  yes.style.transform = `scale(${1 + noCount * .2})`;
  tease.style.opacity = 0;
  setTimeout(() => { tease.textContent = step.tease; tease.style.opacity = 1; }, 250);

  if (step.btn) {
    noBtn.textContent = step.btn;
    noBtn.style.transform = `scale(${Math.max(.65, 1 - noCount * .1)}) rotate(${rand(-6, 6)}deg)`;
  } else {
    noBtn.style.opacity = 0;
    noBtn.style.transform = "scale(.3)";
    setTimeout(() => noBtn.remove(), 400);
  }
}

function accept(yesBtn) {
  if (phase === "yes") return;
  phase = "yes";
  warmthTarget = 1;
  rainUntil = performance.now() + 9000;

  const r = yesBtn.getBoundingClientRect();
  for (let i = 0; i < 90; i++) spawn(r.left + r.width / 2, r.top + r.height / 2, true);
  if (navigator.vibrate) navigator.vibrate([80, 60, 120]);

  message.classList.remove("show");
  setTimeout(() => $("final").classList.add("show"), 1600);
}

/* ===================== Inicio ===================== */
$("openBtn").addEventListener("click", e => {
  e.stopPropagation();
  $("intro").classList.add("hide");
  phase = "story";
  growStart = performance.now() + 600;
  setTimeout(() => { hint.classList.add("show"); showStep(0); }, 1800);
});

$("again").addEventListener("click", () => location.reload());

window.addEventListener("resize", resize);
resize();
requestAnimationFrame(loop);
</script>
</body>
